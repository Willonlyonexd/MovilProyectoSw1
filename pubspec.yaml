name: reproductor_colaborativo_sw1
description: "A new Flutter project."

# The following line prevents the package from being accidentally published to pub.dev
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# Version number for your application
version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.18.1
  cupertino_icons: ^1.0.6 # iOS style icons support
  lottie: ^2.2.0 # For Lottie animations
  http: ^1.2.2
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.3
  app_links: ^3.0.0
  flutter_riverpod: ^2.6.1
  spotify_sdk: ^3.0.2
  socket_io_client: ^2.0.3+1
  provider: ^6.1.2
  palette_generator: ^0.3.0
  smooth_page_indicator: ^1.0.0
  graphql_flutter: ^5.1.2
  flutter_secure_storage: ^8.0.0






dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0 # Linting rules for clean code

flutter:
  # Enables Material Design Icons
  uses-material-design: true

  # Declare assets here
  assets:
    - assets/Lottie/
    - assets/images/
    - assets/data/menu_data_es.json




  fonts:
    - family: Starshines
      fonts:
        - asset: assets/Fonts/Starshines.ttf
    - family: Ocean
      fonts:
        - asset: assets/Fonts/Ocean.otf